name: Deploy Nuxt Frontend & Laravel Backend

on:
  push:
    branches:
      - prod

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # --- ১. FRONTEND BUILD & FTP DEPLOY ---
  deploy-frontend:
    name: Deploy Nuxt Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Generate static site
        run: npm run generate
        working-directory: ./frontend
        env:
          NUXT_PUBLIC_API_BASE: https://admin.shahinenterprise.com.bd/api
          NUXT_PUBLIC_BACKEND_BASE: https://admin.shahinenterprise.com.bd

      - name: Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./frontend/.output/public/
          server-dir: /public_html/

  # --- ২. LARAVEL BACKEND SSH DEPLOY ---
  deploy-backend:
    name: Deploy Laravel Backend
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote SSH Commands for Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd domains/shahinenterprise.com.bd/public_html || cd public_html || cd ~
            pwd
            git fetch origin prod
            git reset --hard origin/prod
            cd adminpanel
            php artisan migrate --force
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear